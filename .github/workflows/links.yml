name: Check links

on:
  pull_request:
    paths:
      - "**.md"
      - lychee.toml
      - .github/workflows/links.yml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Reads lychee.toml from the repository root. The action passes the
      # workflow's GITHUB_TOKEN to lychee to avoid GitHub rate limits.
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --no-progress '**/*.md'
